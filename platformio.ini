; PlatformIO Project Configuration — simpleLoRa reference firmware
;
; Minimal point-to-point LoRa PHY example for SQC485I v2 hardware (ESP32-C3 + SX1262).
; Deliberately NOT LoRaWAN — sends/receives a raw custom payload directly over the SX1262
; radio (via the siliqs_esp32 LoRaService wrapper around RadioLib), to demonstrate that a
; non-LoRaWAN payload passes through a LoRaWAN-oriented concentrator (concentratord) unmodified.
;
; Two build envs select which side of the ping-pong pair a board is (see src/main.cpp):
;   pio run -e node1 -t upload   → initiator (sends first)
;   pio run -e node2 -t upload   → responder (waits, then echoes)
; Both envs produce the same behaviour after the first exchange — the split only avoids
; both boards transmitting simultaneously at boot.

[platformio]
default_envs = node1, node2

[env]
platform = espressif32@6.7.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 115200
; ESP32-C3's native USB-Serial/JTAG peripheral was unreliable on the dev Mac when esptool's
; upload stub tried to switch to a higher baud rate ("Stub running..." then "No serial data
; received", reproducible, survived a real VBUS power-cycle). --no-stub (ROM bootloader only,
; fixed low baud) fixed it every time in manual esptool testing. See simplelora-fw/log.md.
upload_flags = --no-stub
lib_ldf_mode = deep+
build_flags =
    -I${PROJECT_INCLUDE_DIR}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:node1]
build_flags =
    ${env.build_flags}
    -DSIMPLELORA_ROLE_INITIATOR
    -DSIMPLELORA_NODE_ID=1

[env:node2]
build_flags =
    ${env.build_flags}
    -DSIMPLELORA_NODE_ID=2
